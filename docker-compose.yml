version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - APP_NAME=GoldenHackathon
      - JWT_SECRET=golden-hackathon-super-secret-key-2026
      - ENABLE_BILLING_MODULE=true
      - ENABLE_SPENDX_MODULE=true
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:5000
      - VITE_USE_MOCK=false
    depends_on:
      - backend
